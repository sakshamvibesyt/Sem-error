services:
  - type: worker
    name: desi-movie-finder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MONGO_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: PREFIX
        value: "."
      - key: TAG_DELAY
        value: "1.2"
      - key: BROADCAST_DELAY
        value: "2.0"
